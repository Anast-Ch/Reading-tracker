services:
  db:
    image: postgres:16
    container_name: reading_tracker_db
    environment:
      POSTGRES_USER: reading
      POSTGRES_PASSWORD: reading
      POSTGRES_DB: reading_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reading -d reading_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
